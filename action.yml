name: nayraa
description: AI-powered code review via Gemini and reviewdog
inputs:
  base:
    description: Base commit SHA
    required: true
  head:
    description: Head commit SHA
    required: true
  model:
    description: Model name
    required: false
    default: ""
  src-roots:
    description: Source root directories (comma-separated)
    required: false
    default: .
  shape-review:
    description: >
      Review the shape of the pull request as a whole and post the result as a
      single sticky comment. Advisory, unmeasured, and off by default.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - run: pip install "$ACTION_PATH"
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
    - uses: reviewdog/action-setup@v1
    - run: |
        set -euo pipefail
        args=(--repo-root . --base "$BASE" --head "$HEAD")
        IFS=',' read -ra roots <<< "$SRC_ROOTS"
        for r in "${roots[@]}"; do
          args+=(--src-root "$r")
        done
        if [ -n "$MODEL" ]; then
          args+=(--model "$MODEL")
        fi
        if [ "$SHAPE_REVIEW" = "true" ]; then
          args+=(--shape-out "$SHAPE_FILE")
        fi
        nayraa "${args[@]}" \
          | reviewdog -f=rdjsonl -name=nayraa \
              -reporter=github-pr-review \
              -filter-mode=nofilter \
              -level=warning
      shell: bash
      env:
        BASE: ${{ inputs.base }}
        HEAD: ${{ inputs.head }}
        MODEL: ${{ inputs.model }}
        SRC_ROOTS: ${{ inputs.src-roots }}
        SHAPE_REVIEW: ${{ inputs.shape-review }}
        SHAPE_FILE: ${{ runner.temp }}/nayraa-shape.md
    - if: ${{ inputs.shape-review == 'true' && github.event.pull_request.number }}
      run: |
        set -euo pipefail
        if [ ! -f "$SHAPE_FILE" ]; then
          echo "shape review produced no output; leaving any existing comment alone"
          exit 0
        fi
        ids=$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
                --jq ".[] | select(.body | startswith(\"${MARKER}\")) | .id") || ids=""
        id=${ids%%$'\n'*}
        if [ -s "$SHAPE_FILE" ]; then
          body=$(cat "$SHAPE_FILE")
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${id}" \
              -f body="$body" >/dev/null
            echo "updated shape comment ${id}"
          else
            gh api -X POST "repos/${REPO}/issues/${PR}/comments" \
              -f body="$body" >/dev/null
            echo "created shape comment"
          fi
        elif [ -n "$id" ]; then
          gh api -X DELETE "repos/${REPO}/issues/comments/${id}" >/dev/null
          echo "removed resolved shape comment ${id}"
        else
          echo "no shape objections"
        fi
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        MARKER: "<!-- nayraa:shape -->"
        SHAPE_FILE: ${{ runner.temp }}/nayraa-shape.md
