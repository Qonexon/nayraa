name: nayraa
description: AI-powered code review via Gemini and reviewdog
inputs:
  base:
    description: Base commit SHA
    required: true
  head:
    description: Head commit SHA
    required: true
  model:
    description: Model name
    required: false
    default: ""
  src-roots:
    description: Source root directories (comma-separated)
    required: false
    default: .
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - run: pip install "$ACTION_PATH"
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
    - uses: reviewdog/action-setup@v1
    - run: |
        set -euo pipefail
        args=(--repo-root . --base "$BASE" --head "$HEAD")
        IFS=',' read -ra roots <<< "$SRC_ROOTS"
        for r in "${roots[@]}"; do
          args+=(--src-root "$r")
        done
        if [ -n "$MODEL" ]; then
          args+=(--model "$MODEL")
        fi
        nayraa "${args[@]}" \
          | reviewdog -f=rdjsonl -name=nayraa \
              -reporter=github-pr-review \
              -filter-mode=nofilter \
              -level=warning
      shell: bash
      env:
        BASE: ${{ inputs.base }}
        HEAD: ${{ inputs.head }}
        MODEL: ${{ inputs.model }}
        SRC_ROOTS: ${{ inputs.src-roots }}
