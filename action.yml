name: nayraa
description: Reviews the shape of a pull request, not the correctness of its lines
inputs:
  base:
    description: Base commit SHA
    required: true
  head:
    description: Head commit SHA
    required: true
  model:
    description: Model name
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - run: pip install "$ACTION_PATH"
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
    - run: |
        set -uo pipefail
        args=(--repo-root . --base "$BASE" --head "$HEAD" --out "$OUT")
        if [ -n "$MODEL" ]; then
          args+=(--model "$MODEL")
        fi
        nayraa "${args[@]}"
        exit 0
      shell: bash
      env:
        BASE: ${{ inputs.base }}
        HEAD: ${{ inputs.head }}
        MODEL: ${{ inputs.model }}
        OUT: ${{ runner.temp }}/nayraa-shape.md
    - if: ${{ !cancelled() && github.event.pull_request.number }}
      run: |
        set -uo pipefail
        if [ ! -s "$OUT" ]; then
          echo "no comment was produced; leaving any existing comment alone"
          exit 0
        fi
        ids=$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
                --jq ".[] | select(.user.type == \"Bot\")
                          | select(.body | startswith(\"${MARKER}\")) | .id") || ids=""
        id=${ids%%$'\n'*}
        body=$(cat "$OUT")
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/${REPO}/issues/comments/${id}" \
            -f body="$body" >/dev/null \
            && echo "updated shape comment ${id}" \
            || echo "could not update shape comment ${id}"
          for extra in ${ids#*$'\n'}; do
            if [ "$extra" != "$id" ]; then
              gh api -X DELETE "repos/${REPO}/issues/comments/${extra}" >/dev/null \
                && echo "deleted duplicate shape comment ${extra}" \
                || echo "could not delete duplicate shape comment ${extra}"
            fi
          done
        else
          gh api -X POST "repos/${REPO}/issues/${PR}/comments" \
            -f body="$body" >/dev/null \
            && echo "created shape comment" \
            || echo "could not create shape comment"
        fi
        exit 0
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        MARKER: "<!-- nayraa:shape -->"
        OUT: ${{ runner.temp }}/nayraa-shape.md
