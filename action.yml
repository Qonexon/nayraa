name: nayraa
description: AI-powered code review via Gemini and reviewdog
inputs:
  base:
    description: Base commit SHA
    required: true
  head:
    description: Head commit SHA
    required: true
  model:
    description: Model name
    required: false
    default: ""
  src-roots:
    description: Source root directories (comma-separated)
    required: false
    default: .
  backend:
    description: Backend to use (gemini or vertex)
    required: false
    default: gemini
  project:
    description: Google Cloud project for Vertex AI
    required: false
    default: ""
  location:
    description: Google Cloud location for Vertex AI
    required: false
    default: global
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - run: pip install "$ACTION_PATH"
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
    - uses: reviewdog/action-setup@v1
    - run: |
        set -euo pipefail
        args=(
          --repo-root .
          --base "$BASE"
          --head "$HEAD"
          --backend "$BACKEND"
          --location "$LOCATION"
        )
        IFS=',' read -ra roots <<< "$SRC_ROOTS"
        for r in "${roots[@]}"; do
          args+=(--src-root "$r")
        done
        if [ -n "$MODEL" ]; then
          args+=(--model "$MODEL")
        fi
        if [ -n "$PROJECT" ]; then
          args+=(--project "$PROJECT")
        fi
        nayraa "${args[@]}" \
          | reviewdog -f=rdjsonl -name=nayraa \
              -reporter=github-pr-review \
              -filter-mode=nofilter \
              -level=warning
      shell: bash
      env:
        BASE: ${{ inputs.base }}
        HEAD: ${{ inputs.head }}
        MODEL: ${{ inputs.model }}
        SRC_ROOTS: ${{ inputs.src-roots }}
        BACKEND: ${{ inputs.backend }}
        PROJECT: ${{ inputs.project }}
        LOCATION: ${{ inputs.location }}
        GOOGLE_CLOUD_PROJECT: ${{ inputs.project }}
        GOOGLE_CLOUD_LOCATION: ${{ inputs.location }}
